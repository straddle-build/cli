name: API Sync

"on":
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      contract_version:
        description: "Exact released Scalar contract version (X.Y.Z)."
        required: true
        type: string
      dry_run:
        description: "Verify and generate without opening a pull request."
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [straddle-contract-published]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: api-sync
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  HAS_API_SYNC_BOT_TOKEN: ${{ secrets.API_SYNC_BOT_TOKEN != '' && 'true' || 'false' }}

jobs:
  sync:
    name: Sync published API contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify checked-in contract
        run: go run ./cmd/gen-endpoint verify-lock --lock contract.lock.json --spec spec.yaml

      - name: Resolve exact Scalar version
        id: release
        shell: bash
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_VERSION: ${{ github.event.inputs.contract_version }}
        run: |
          set -euo pipefail

          expected_digest=""
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            selected_version="$(jq -er '.contract_version' <<<"${DISPATCH_PAYLOAD}")"
            expected_digest="$(jq -er '.published_sha256' <<<"${DISPATCH_PAYLOAD}")"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            selected_version="${MANUAL_VERSION}"
          else
            discovery="${RUNNER_TEMP}/scalar-current.yaml"
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
              --output "${discovery}" \
              "https://registry.scalar.com/@straddle/apis/straddle-api?format=yaml"
            selected_version="$(go run ./cmd/gen-endpoint version --spec "${discovery}")"
          fi

          [[ "${selected_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Contract version must be exact semver, got: ${selected_version}" >&2
            exit 1
          }
          if [ -n "${expected_digest}" ] && [[ ! "${expected_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Published digest must be lowercase SHA-256." >&2
            exit 1
          fi

          echo "version=${selected_version}" >> "${GITHUB_OUTPUT}"
          echo "registry_ref=@straddle/straddle-api@${selected_version}" >> "${GITHUB_OUTPUT}"
          echo "published_sha256=${expected_digest}" >> "${GITHUB_OUTPUT}"

      - name: Fetch and verify exact Scalar contract
        id: contract
        shell: bash
        env:
          CONTRACT_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_SHA256: ${{ steps.release.outputs.published_sha256 }}
          GH_TOKEN: ${{ secrets.API_SYNC_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail

          published="${RUNNER_TEMP}/published.openapi.yaml"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
            --output "${published}" \
            "https://registry.scalar.com/@straddle/apis/straddle-api@${CONTRACT_VERSION}?format=yaml"

          candidate_args=(candidate-status --lock contract.lock.json --spec "${published}" --version "${CONTRACT_VERSION}")
          if [ -n "${EXPECTED_SHA256}" ]; then
            candidate_args+=(--published-sha256 "${EXPECTED_SHA256}")
          fi
          status="$(go run ./cmd/gen-endpoint "${candidate_args[@]}")"

          sync_branch="automation/api-sync-${CONTRACT_VERSION}"
          if [ "${status}" = "new" ]; then
            open_pr="$(gh pr list --state open --head "${sync_branch}" --json number --jq '.[0].number // empty')"
            if [ -n "${open_pr}" ]; then
              git fetch --no-tags origin "refs/heads/${sync_branch}:refs/remotes/origin/${sync_branch}"
              pending_lock="${RUNNER_TEMP}/pending-contract.lock.json"
              pending_spec="${RUNNER_TEMP}/pending-spec.yaml"
              git show "refs/remotes/origin/${sync_branch}:contract.lock.json" > "${pending_lock}"
              git show "refs/remotes/origin/${sync_branch}:spec.yaml" > "${pending_spec}"
              go run ./cmd/gen-endpoint verify-lock --lock "${pending_lock}" --spec "${pending_spec}" >/dev/null

              candidate_args=(candidate-status --lock "${pending_lock}" --spec "${published}" --version "${CONTRACT_VERSION}")
              if [ -n "${EXPECTED_SHA256}" ]; then
                candidate_args+=(--published-sha256 "${EXPECTED_SHA256}")
              fi
              status="$(go run ./cmd/gen-endpoint "${candidate_args[@]}")"
            fi
          fi

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "published=${published}" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(sha256sum "${published}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Report current contract
        if: steps.contract.outputs.status == 'current'
        run: echo "${{ steps.release.outputs.registry_ref }} is already synchronized or pending review with identical bytes." >> "${GITHUB_STEP_SUMMARY}"

      - name: Classify field-level contract changes
        if: steps.contract.outputs.status == 'new'
        id: drift
        shell: bash
        env:
          PUBLISHED: ${{ steps.contract.outputs.published }}
        run: |
          set -euo pipefail

          drift_json="${RUNNER_TEMP}/drift.json"
          go run ./cmd/gen-endpoint drift --base spec.yaml --head "${PUBLISHED}" --repo . --agent > "${drift_json}"
          jq -e 'type == "object"' "${drift_json}" >/dev/null

          echo "drift_json=${drift_json}" >> "${GITHUB_OUTPUT}"
          {
            echo "field_changes<<EOF"
            jq -r '[
              .changes[] as $change
              | $change.fields[]
              | "- \($change.head.method) \($change.head.path): \(.flag) (\(.kind)) \(.detail)"
            ] | .[:50][]' "${drift_json}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Update pinned contract
        if: steps.contract.outputs.status == 'new'
        env:
          CONTRACT_VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED: ${{ steps.contract.outputs.published }}
          PUBLISHED_SHA256: ${{ steps.contract.outputs.sha256 }}
        run: |
          set -euo pipefail

          cp "${PUBLISHED}" spec.yaml
          jq -n \
            --arg version "${CONTRACT_VERSION}" \
            --arg digest "${PUBLISHED_SHA256}" \
            '{schema_version:1,contract_version:$version,registry_ref:("@straddle/straddle-api@" + $version),published_sha256:$digest}' \
            > contract.lock.json

      - name: Regenerate endpoint commands
        if: steps.contract.outputs.status == 'new'
        id: generate
        shell: bash
        run: |
          set -euo pipefail

          generate_json="${RUNNER_TEMP}/generate.json"
          go run ./cmd/gen-endpoint generate --spec spec.yaml --repo . --agent > "${generate_json}"
          jq -e 'type == "object"' "${generate_json}" >/dev/null

          echo "generate_json=${generate_json}" >> "${GITHUB_OUTPUT}"
          echo "generated=$(jq '.generated | length' "${generate_json}")" >> "${GITHUB_OUTPUT}"
          echo "deleted=$(jq '.deleted | length' "${generate_json}")" >> "${GITHUB_OUTPUT}"
          echo "unchanged=$(jq '.unchanged | length' "${generate_json}")" >> "${GITHUB_OUTPUT}"
          echo "unsupported=$(jq '.unsupported | length' "${generate_json}")" >> "${GITHUB_OUTPUT}"

      - name: Verify synchronized CLI
        if: steps.contract.outputs.status == 'new'
        run: |
          set -euo pipefail

          go run ./cmd/gen-endpoint check --spec spec.yaml --repo . --agent
          unformatted="$(gofmt -l internal/cli)"
          if [ -n "${unformatted}" ]; then
            printf 'Generated endpoint files are not formatted:\n%s\n' "${unformatted}" >&2
            exit 1
          fi
          STRADDLE_API_SYNC_REVIEW=true go test ./...
          go vet ./...

      - name: Capture proposed change
        if: steps.contract.outputs.status == 'new'
        id: proposed_change
        run: |
          set -euo pipefail

          patch_file="${RUNNER_TEMP}/api-sync.patch"
          git add --intent-to-add -- .
          git diff --binary -- . > "${patch_file}"
          test -s "${patch_file}"
          echo "patch_file=${patch_file}" >> "${GITHUB_OUTPUT}"

      - name: Require automation token
        if: steps.contract.outputs.status == 'new' && env.DRY_RUN != 'true' && env.HAS_API_SYNC_BOT_TOKEN != 'true'
        run: |
          echo "API_SYNC_BOT_TOKEN is required to open the contract synchronization PR." >&2
          exit 1

      - name: Open contract synchronization pull request
        if: steps.contract.outputs.status == 'new' && env.DRY_RUN != 'true' && env.HAS_API_SYNC_BOT_TOKEN == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.API_SYNC_BOT_TOKEN }}
          branch: automation/api-sync-${{ steps.release.outputs.version }}
          delete-branch: true
          commit-message: "chore: sync API contract ${{ steps.release.outputs.version }}"
          title: "chore: sync API contract ${{ steps.release.outputs.version }}"
          body: |
            Review summary:
            - Contract: `${{ steps.release.outputs.registry_ref }}`
            - Generated: ${{ steps.generate.outputs.generated }}
            - Deleted: ${{ steps.generate.outputs.deleted }}
            - Unchanged: ${{ steps.generate.outputs.unchanged }}
            - Unsupported: ${{ steps.generate.outputs.unsupported }}

            Field-level changes (first 50):
            ${{ steps.drift.outputs.field_changes }}

            Full drift details are in the [`api-sync-${{ github.run_id }}` artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            This pull request requires normal human review. Merging it creates a patch release only when the merge changes a file other than `spec.yaml` and `contract.lock.json`.

      - name: Report dry-run result
        if: steps.contract.outputs.status == 'new' && env.DRY_RUN == 'true'
        run: echo "Dry run completed; the proposed contract change is available in the workflow artifact." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload synchronization evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-sync-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/published.openapi.yaml
            ${{ runner.temp }}/drift.json
            ${{ runner.temp }}/generate.json
            ${{ runner.temp }}/api-sync.patch

      - name: Summarize synchronization
        if: always()
        run: |
          echo "## API sync" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "- Contract: ${{ steps.release.outputs.registry_ref || 'unresolved' }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Status: ${{ steps.contract.outputs.status || 'failed' }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Generated: ${{ steps.generate.outputs.generated || 'n/a' }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Deleted: ${{ steps.generate.outputs.deleted || 'n/a' }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Unchanged: ${{ steps.generate.outputs.unchanged || 'n/a' }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Unsupported: ${{ steps.generate.outputs.unsupported || 'n/a' }}" >> "${GITHUB_STEP_SUMMARY}"
