  schemas:
    Account:
      required:
        - organization_id
        - status
        - id
        - type
        - status_detail
        - access_level
      type: object
      properties:
        id:
          type: string
          description: Straddle's unique ID for the account.
          format: uuid
        organization_id:
          type: string
          description: ID of the organization that owns the account.
          format: uuid
        type:
          enum:
            - business
          type: string
          description: The account type. Only `business` is supported.
        status:
          enum:
            - created
            - onboarding
            - active
            - rejected
            - inactive
          type: string
          description: The current lifecycle status of the account.
        status_detail:
          $ref: "#/components/schemas/AccountStatusDetail"
        business_profile:
          $ref: "#/components/schemas/AccountBusinessProfile"
        capabilities:
          $ref: "#/components/schemas/AccountCapabilities"
        settings:
          $ref: "#/components/schemas/AccountPaymentSettings"
        terms_of_service:
          $ref: "#/components/schemas/TermsOfService"
        metadata:
          type:
            - object
            - "null"
          additionalProperties:
            type:
              - string
              - "null"
          description: Up to 20 user-defined key-value pairs.
        access_level:
          enum:
            - standard
            - managed
          type: string
          description: The account access level. `standard` provides normal account
            access, including access to the Straddle dashboard. `managed` means
            the platform manages the account and account users cannot access the
            Straddle dashboard.
        external_id:
          type:
            - string
            - "null"
          description: Your unique ID for the account.
        created_at:
          type:
            - string
            - "null"
          description: Date and time when Straddle created the account.
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          description: Date and time of the most recent account update.
          format: date-time
      additionalProperties: false
    AccountAddress:
      type:
        - object
        - "null"
      description: Optional business address. If provided, `line1`, `city`, `state`,
        and `postal_code` are required.
      properties:
        line1:
          type:
            - string
            - "null"
          description: Primary address line, such as a street address or PO Box.
        line2:
          type:
            - string
            - "null"
          description: Secondary address line, such as an apartment, suite, unit, or
            building.
        city:
          type:
            - string
            - "null"
          description: City, district, suburb, town, or village.
        state:
          type:
            - string
            - "null"
          description: Two-letter state code.
          pattern: ^[A-Z]{2}$
        postal_code:
          type:
            - string
            - "null"
          description: Postal or ZIP code.
          pattern: ^[0-9]{5}(-[0-9]{4})?$
        country:
          type:
            - string
            - "null"
          description: Two-letter ISO 3166-1 country code. If omitted, Straddle applies US
            address validation.
      additionalProperties: false
      required:
        - city
        - state
        - postal_code
        - line1
    UnmaskedLinkedBankAccountDetails:
      required:
        - institution_name
        - account_holder
        - routing_number
        - account_number
      type: object
      properties:
        institution_name:
          type: string
          description: Name of the financial institution.
        account_holder:
          type: string
          description: Name of the account holder as it appears on the bank account.
        routing_number:
          type: string
          description: Nine-digit ABA routing number for the bank account.
        account_number:
          type: string
          description: Bank account number.
      additionalProperties: false
    MaskedLinkedBankAccountDetails:
      required:
        - institution_name
        - account_holder
        - routing_number
        - account_mask
      type: object
      properties:
        institution_name:
          type: string
          description: Name of the financial institution.
        account_holder:
          type: string
          description: Name of the account holder as it appears on the bank account.
        routing_number:
          type: string
          description: Nine-digit ABA routing number for the bank account.
        account_mask:
          type: string
          description: Last four digits of the bank account number.
      additionalProperties: false
    LinkedBankAccountDetailsRequest:
      required:
        - account_holder
        - routing_number
        - account_number
      type: object
      properties:
        account_holder:
          type: string
          description: Account holder name as it appears on the bank account. This is
            usually the business's legal name.
        routing_number:
          type: string
          description: Nine-digit ABA routing number.
          minLength: 9
          maxLength: 9
        account_number:
          type: string
          description: The bank account number.
      additionalProperties: false
    AccountBusinessProfile:
      required:
        - website
        - name
      type: object
      properties:
        name:
          type: string
          description: The operating or trade name of the business.
        website:
          type: string
          format: uri
          description: URL of the business's primary website.
        legal_name:
          type:
            - string
            - "null"
          description: The official registered name of the business.
        description:
          type:
            - string
            - "null"
          description: Description of the business and its products or services.
        use_case:
          type:
            - string
            - "null"
          description: How the business plans to use Straddle.
        tax_id:
          type:
            - string
            - "null"
          description: Business tax identification number, such as a US Employer
            Identification Number (EIN).
          pattern: ^[0-9]{9}$
        phone:
          type:
            - string
            - "null"
          description: Primary business phone number in E.164 format.
          pattern: ^\+[1-9]\d{1,14}$
        address:
          $ref: "#/components/schemas/AccountAddress"
        industry:
          $ref: "#/components/schemas/AccountIndustry"
        support_channels:
          $ref: "#/components/schemas/AccountSupportChannels"
      additionalProperties: false
    CapabilitySetting:
      required:
        - enable
      type: object
      properties:
        enable:
          type: boolean
          description: Whether the request enables or disables the capability.
      additionalProperties: false
    AccountCapabilities:
      required:
        - customer_types
        - consent_types
        - payment_types
      type: object
      properties:
        payment_types:
          $ref: "#/components/schemas/AccountPaymentCapabilities"
        customer_types:
          $ref: "#/components/schemas/AccountCustomerCapabilities"
        consent_types:
          $ref: "#/components/schemas/AccountConsentCapabilities"
      additionalProperties: false
    AccountCapability:
      required:
        - capability_status
      type: object
      properties:
        capability_status:
          enum:
            - active
            - inactive
          type: string
          description: Status of the capability for the account.
      additionalProperties: false
    CapabilityRequest:
      required:
        - created_at
        - account_id
        - category
        - updated_at
        - status
        - id
        - type
        - enable
      type: object
      properties:
        id:
          type: string
          description: Straddle's unique ID for the capability request.
          format: uuid
        account_id:
          type: string
          description: ID of the account associated with the capability request.
          format: uuid
        type:
          enum:
            - charges
            - payouts
            - individuals
            - businesses
            - signed_agreement
            - internet
          type: string
          description: Capability type requested within the category.
        category:
          enum:
            - payment_type
            - customer_type
            - consent_type
          type: string
          description: Groups the requested capability. `payment_type` covers `charges`
            and `payouts`. `customer_type` covers `individuals` and
            `businesses`. `consent_type` covers `signed_agreement` and
            `internet` authorization.
        settings:
          type:
            - object
            - "null"
          additionalProperties: {}
          description: Limits and other settings requested for the capability.
        status:
          enum:
            - active
            - inactive
            - in_review
            - rejected
            - approved
            - reviewing
          type: string
          description: Status of the capability request.
        created_at:
          type: string
          description: Date and time when Straddle created the capability request.
          format: date-time
        updated_at:
          type: string
          description: Date and time of the most recent capability request update.
          format: date-time
        enable:
          type: boolean
          description: Whether the request enables or disables the capability.
      additionalProperties: false
    AccountChargeSettings:
      required:
        - max_amount
        - monthly_amount
        - monthly_count
        - daily_amount
        - linked_bank_account_id
        - funding_time
      type: object
      properties:
        max_amount:
          type: integer
          format: int32
          description: Maximum amount in cents for one charge.
        monthly_amount:
          type: integer
          format: int32
          description: Monthly charge amount limit in cents.
        daily_amount:
          type: integer
          format: int32
          description: Daily charge amount limit in cents.
        monthly_count:
          type: integer
          format: int32
          description: Maximum number of charges per calendar month.
        funding_time:
          enum:
            - immediate
            - next_day
            - one_day
            - two_day
            - three_day
            - four_day
            - five_day
          type: string
          description: Funding schedule for charges. Straddle sets this value.
        linked_bank_account_id:
          type: string
          format: uuid
          description: ID of the linked bank account used for charge settlement. Straddle
            sets this value.
      additionalProperties: false
    ChargeCapabilityRequest:
      required:
        - max_amount
        - monthly_amount
        - monthly_count
        - daily_amount
        - enable
      type: object
      properties:
        enable:
          type: boolean
          description: Whether to enable or disable charges for the account.
        max_amount:
          type: number
          format: double
          description: Maximum amount in cents for one charge.
        daily_amount:
          type: number
          format: double
          description: Daily charge amount limit in cents.
        monthly_count:
          type: integer
          format: int32
          description: Maximum number of charges per calendar month.
        monthly_amount:
          type: number
          format: double
          description: Monthly charge amount limit in cents.
      additionalProperties: false
    AccountConsentCapabilities:
