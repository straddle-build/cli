components:
  examples:
    IndividualCustomerRequest:
      summary: Create an individual sandbox customer
      description: Replace the identity fields and device IP with your sandbox
        customer data, and generate a unique external_id.
      value:
        name: Alex Example
        type: individual
        email: alex@example.com
        phone: "+12025550101"
        device:
          ip_address: 192.0.2.10
        external_id: example-customer-individual-001
        config:
          sandbox_outcome: verified
    BusinessCustomerRequest:
      summary: Create a business customer with KYB information
      description: Replace the business identity fields, device IP and external_id.
        The address illustrates a sandbox KYB review scenario. EIN 00-0000000 is
        synthetic, not a usable tax ID or a promise of approval.
      value:
        name: Example Supply LLC
        type: business
        email: billing@example.com
        phone: "+12025550102"
        device:
          ip_address: 192.0.2.11
        external_id: example-customer-business-001
        address:
          address1: 1234 Sandbox Street
          address2: PO Box I304
          city: Mock City
          state: CA
          zip: "94105"
        compliance_profile:
          ein: 00-0000000
          legal_business_name: Example Supply LLC
          website: https://example.com
          representatives:
            - name: Jordan Example
        config:
          sandbox_outcome: review
    IndividualCustomerResponse:
      summary: Individual customer created
      description: Illustrative verified individual. Use the returned customer ID when
        linking a bank account.
      value:
        meta:
          api_request_id: 91f0c2cc-6dc9-404e-8081-2b750347f8dd
          api_request_timestamp: 2026-09-10T15:00:00Z
        response_type: object
        data:
          name: Alex Example
          type: individual
          email: alex@example.com
          phone: "+12025550101"
          external_id: example-customer-individual-001
          id: 18a332cc-2a60-4f11-86a2-11dba3541821
          status: verified
          created_at: 2026-09-10T15:00:00Z
          updated_at: 2026-09-10T15:00:00Z
    BusinessCustomerResponse:
      summary: Business customer created
      description: Illustrative business awaiting review, with a masked EIN.
