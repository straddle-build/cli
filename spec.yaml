openapi: 3.1.1
info:
  title: Straddle API
  version: 1.0.4
  description: >-
    # Introduction


    The Straddle API uses resource URLs, standard HTTP methods, and JSON request
    and response bodies.



    # Environments


    Sandbox and Production use separate base URLs and API keys. Use Sandbox for
    testing and development. Use Production for live transactions.


    | Environment | Base URL                      | Purpose                 |

    |-------------|-------------------------------|------------------------|

    | Sandbox     | `https://sandbox.straddle.com` | Testing and development |

    | Production  | `https://production.straddle.com` | Live
    transactions       |


    Use the API key issued for the request's environment. An API key from
    another environment does not authenticate the request.



    # Authentication


    Straddle authenticates API requests with JWT bearer tokens. Send your secret
    API key in the `Authorization` header:


    ```bash

    curl https://sandbox.straddle.com/v1/customers \
      -H "Authorization: Bearer YOUR_SECRET_API_KEY"
    ```



    # Idempotent requests


    Use idempotency to retry a request without performing the same operation
    twice. Send a unique `Idempotency-Key` header with the request.


    After Straddle processes a request successfully, an identical request with
    the same key returns the original status code, headers, and body without
    repeating the operation.



    ### Request headers


    Send a unique string of 10 to 40 characters in the `Idempotency-Key` header.


    | Header | Type | Description |

    |--------|------|-------------|

    | `Idempotency-Key` | string | A unique identifier for the request. The
    value must contain 10 to 40 characters. |


    ### Response headers


    A successfully replayed request returns the original HTTP status code,
    response headers, and body. The response also includes:


    | Header | Type | Description |

    |--------|------|-------------|

    | `Idempotent-Replayed` | boolean | `true` when the response replays a
    previously successful request. |


    ### Idempotency errors


    The API returns these errors for invalid or conflicting idempotency keys:


    | Status Code | Error Type | Description |

    |-------------|------------|-------------|

    | **400** | Bad Request | The `Idempotency-Key` value is shorter than 10
    characters or longer than 40 characters. |

    | **409** | Conflict | The key was used for a different request, or an
    identical request with the key is still in progress. |


    ### Key reused for a different request


    A request returns `409 Conflict` when its `Idempotency-Key` was used for a
    request with a different path, method, or body.


    ```json

    {
      "status": 409,
      "type": "/conflict",
      "title": "Conflict",
      "detail": "Idempotency key already used for a different request."
    }

    ```


    ### Identical request still in progress


    An identical request returns `409 Conflict` when another request with the
    same `Idempotency-Key` is still in progress.


    ```json

    {
      "status": 409,
      "type": "/conflict",
      "title": "Conflict",
      "detail": "Previous identical request currently in progress."
    }

    ```


    ### Invalid key length


    A request returns `400 Bad Request` when its `Idempotency-Key` is shorter
    than 10 characters or longer than 40 characters.


    ```json

    {
      "status": 400,
      "type": "/bad-request",
      "title": "Bad Request",
      "detail": "The Idempotency-Key header is invalid. It must be between 10 and 40 characters long."
    }

    ```



    ### Example request


    ```bash

    curl -X POST https://sandbox.straddle.com/v1/charges \

    -H "Authorization: Bearer YOUR_API_KEY" \

    -H "Content-Type: application/json" \

    -H "Idempotency-Key: unique-client-key-7890" \

    -d '{
      "amount": 100.00,
      "currency": "USD"
    }'

    ```


    Idempotency applies only to authenticated `POST`, `PUT`, `PATCH`, and
    `DELETE` requests.



    # Response structure


    API responses use a JSON envelope. Every envelope has `meta` and
    `response_type`. Other fields depend on the response type.


    - **Field names**
      - Fields use `snake_case`.
      - Resource identifiers use UUIDs.

    - **`response_type`**
      - `"object"` means `data` contains one JSON object.
      - `"array"` means `data` contains an array of JSON objects.
      - `"error"` means `error` contains the error details.
      - `"none"` means the response contains no data.

    - **`data`**
      - Successful object and array responses contain the requested resource data.

    - **`error`**
      - Error responses contain the error details.

    - **`meta`**
      - `api_request_id` is the unique identifier for the API request.
      - `api_request_timestamp` is the ISO 8601 timestamp for the API request.
      - Paginated array responses also include `page_number`, `page_size`, `total_items`, `sort_order`, and `sort_by`.

    ### Examples


    #### Object response


    ```json

    {
      "meta": {
        "api_request_id": "3a2b1c4d-0e6f-4a88-9876-123456abcdef",
        "api_request_timestamp": "2023-11-07T05:31:56Z"
      },
      "response_type": "object",
      "data": {
        "id": "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d",
        "name": "John Doe",
        "email": "john.doe@example.com",
        "dob": "1990-01-01",
        "address": {
          "street": "123 Main St",
          "city": "Springfield",
          "state": "IL",
          "postal_code": "62701"
        }
      }
    }

    ```


    #### Paginated array response


    ```json

    {
      "meta": {
        "api_request_id": "3c90c3cc-0d44-4b50-8888-8dd25736052a",
        "api_request_timestamp": "2023-11-07T05:31:56Z",
        "page_number": 2,
        "page_size": 50,
        "total_items": 500,
        "sort_order": "asc",
        "sort_by": "name"
      },
      "response_type": "array",
      "data": [
        {
          "id": "c1b1b1b1-1b1b-1b1b-1b1b-1b1b1b1b1b1b",
          "name": "John Doe",
          "email": "john.doe@example.com"
        },
        {
          "id": "a9b1b1b1-1b1b-1b1b-1b1b-1b1b1b1b1b1b",
          "name": "Steven Martin",
          "email": "steven.martin@example.com"
        }
      ]
    }

    ```


    #### Error response


    ```json

    {
      "meta": {
        "api_request_id": "f1b1b1b1-1b1b-1b1b-1b1b-1b1b1b1b1b1b"
      },
      "response_type": "error",
      "error": {
        "status": 400,
        "type": "/field_validation",
        "title": "Invalid Input Data",
        "detail": "The request contains invalid field values.",
        "items": [
          {
            "reference": "customer.email",
            "detail": "Email address must be unique."
          }
        ]
      }
    }

    ```



    # Metadata


    The `metadata` field stores user-defined key-value pairs on supported
    Straddle objects.


    `metadata` contains custom data that you provide. It is separate from the
    response `meta` object, which contains information about the API request.


    ### Add metadata


    Include `metadata` when you create or update an object that supports the
    field.


    #### Customer request example


    This customer request includes two metadata entries:


    ```json

    {
      "name": "John Doe",
      "type": "individual",
      "email": "john@example.com",
      "address": {
        "address1": "123 Main St",
        "address2": null,
        "type": "residential",
        "city": "Springfield",
        "state": "IL",
        "zip": "62701"
      },
      "phone": "+1234567890",
      "external_id": "CUS-123",
      "device": {
        "ip_address": "192.168.1.1"
      },
      "metadata": {
        "order_id": "6735",
        "customer_group": "premium"
      }
    }

    ```



    ### Limits


    - Keys and values can contain at most 40 characters.

    - The `metadata` object can contain at most 20 entries.


    # Embedded accounts


    Platforms can send requests in the scope of an embedded account. Send the
    embedded account's UUID in the `Straddle-Account-Id` header.



    ### Send a request for an embedded account


    Include `Straddle-Account-Id` with the embedded account UUID. Authenticate
    the request with the platform's secret API key.


    #### Example charge request


    This request creates a charge in the embedded account's scope.


    ```bash

    curl --request POST \
      --url https://sandbox.straddle.com/v1/charges \
      --header 'Authorization: Bearer <your-secret-api-key>' \
      --header 'Content-Type: application/json' \
      --header 'Straddle-Account-Id: <uuid>' \
      --data '{
        "paykey": "<string>",
        "description": "<string>",
        "amount": 123,
        "currency": "<string>",
        "payment_date": "2023-12-25",
        "consent_type": "internet",
        "device": {
          "ip_address": "<string>"
        },
        "external_id": "<string>",
        "config": {
          "balance_check": "required"
        },
        "metadata": {}
      }'
    ```



    # Errors


    HTTP status codes indicate whether the API completed a request. Error
    responses include a JSON `error` object.


    Common status codes include:


    | Status Code | Type | Description |

    |------------|------|-------------|

    | **200** | OK | The request completed successfully. |

    | **400** | Bad Request | The request is invalid. |

    | **401** | Unauthorized | The request does not include a valid API key. |

    | **403** | Forbidden | The API key does not have permission to perform the
    request. |

    | **404** | Not Found | The requested resource does not exist. |

    | **409** | Conflict | The request conflicts with an existing request or
    operation. |

    | **422** | Unprocessable Entity | The request syntax is valid, but one or
    more values cannot be processed. |

    | **429** | Too Many Requests | The request exceeded a rate limit. |

    | **500, 502, 503, 504** | Server Error | Straddle could not complete the
    request because of a server error. |



    ### Error response structure


    Error responses use the standard response envelope. The `error` object has
    these fields:


    | Attribute | Type | Description |

    |-----------|------|-------------|

    | `status` | integer | HTTP status code for the error. |

    | `type` | string | Identifier for the error type. |

    | `title` | string | Short summary of the error. |

    | `detail` | string | Explanation specific to this request. |

    | `items` | array | Additional error details, when available. |

    | `items[].reference` | string | Request field or error code associated with
    the detail. |

    | `items[].detail` | string | Explanation of the error detail. |


    ### Example error response


    This example shows a field-validation error:


    ```json

    {
      "meta": {
        "api_request_id": "3a2b1c4d-0e6f-4a88-9876-123456abcdef",
        "api_request_timestamp": "2023-11-07T05:31:56Z"
      },
      "response_type": "error",
      "error": {
        "status": 400,
        "type": "validation_error",
        "title": "Invalid Input Data",
        "detail": "The request contains invalid field values.",
        "items": [
          {
            "reference": "customer.email",
            "detail": "Email address must be unique."
          }
        ]
      }
    }

    ```
  contact:
    name: Straddle
    url: https://straddle.io
servers:
  - url: https://{environment}.straddle.com
    description: Straddle API server
    variables:
      environment:
        default: sandbox
        enum:
          - production
          - sandbox
        description: Use sandbox for testing and production for live transactions.
security:
  - Bearer: []
tags:
  - name: customers
    description: Customers are individuals or businesses that send or receive
      payments through your integration.
    x-displayName: Customers
  - name: bridge
    description: Bridge connects customer bank accounts and creates paykeys from
      supported provider tokens or bank account details.
    x-displayName: Bridge
  - name: paykeys
    description: A paykey links a verified customer to a bank account without
      exposing bank account details. Use a paykey to create charges and payouts.
    x-displayName: Paykeys
  - name: charges
    description: Charges debit a customer's bank account through a paykey.
    x-displayName: Charges
  - name: payouts
    description: Payouts send money to a customer's bank account through a paykey.
    x-displayName: Payouts
  - name: fundingEvents
    description: Funding events group charge and payout activity into transfers
      between Straddle and your linked bank account.
    x-displayName: Funding events
  - name: payments
    description: Payments provide a combined view of charges and payouts.
    x-displayName: Payments
  - name: organizations
    description: Organizations group related Straddle accounts.
    x-displayName: Organizations
  - name: accounts
    description: Accounts represent businesses that use Straddle through a platform.
    x-displayName: Accounts
  - name: representatives
    description: Representatives are people associated with a business account for
      ownership, control, or authorization purposes.
    x-displayName: Representatives
  - name: capabilityRequests
    description: Capability requests change the payment, customer, and consent types
      available to an account.
    x-displayName: Capabilities
  - name: linkedBankAccounts
    description: Linked bank accounts connect external bank accounts to an account
      or platform for charges, payouts, or billing.
    x-displayName: Linked bank accounts
  - name: accountSettings
    x-displayName: Account settings
    description: Account settings define payment limits, capabilities, statement
      details, and policy controls for an account.
x-tagGroups:
  - name: Pay by Bank
    tags:
      - customers
      - bridge
      - paykeys
      - charges
      - payouts
      - fundingEvents
      - payments
  - name: Embed
    tags:
      - organizations
      - accounts
      - representatives
      - linkedBankAccounts
      - capabilityRequests
      - accountSettings
paths:
  /v1/customers:
    post:
      tags:
        - customers
      summary: Create a customer
      description: Creates a customer and starts identity, fraud, and risk assessments.
      operationId: createCustomer
      parameters:
        - $ref: "#/components/parameters/StraddleAccountId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
            examples:
              individual:
                $ref: "#/components/examples/IndividualCustomerRequest"
              business:
                $ref: "#/components/examples/BusinessCustomerRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
              examples:
                individual:
                  $ref: "#/components/examples/IndividualCustomerResponse"
                business:
                  $ref: "#/components/examples/BusinessCustomerResponse"
            text/plain:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                bad_request:
                  $ref: "#/components/examples/BadRequestResponse"
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation Failed
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server Error
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - customers
      summary: List customers
      description: Returns a paginated list of customers for the account. Optional
        query parameters filter, search, and sort the results.
      operationId: listCustomers
      parameters:
        - name: page_number
          required: false
          in: query
          description: Page number for paginated results. Starts at 1.
          schema:
            type: integer
            format: int32
            default: 1
        - name: page_size
          required: false
          in: query
          description: "Number of results per page. Maximum: 1000."
          schema:
            type: integer
            format: int32
            default: 100
        - name: sort_by
          required: false
          in: query
          schema:
            $ref: "#/components/schemas/CustomerSortBy"
          description: Field used to sort the results.
        - name: sort_order
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
          description: Order in which to sort the results.
        - name: created_from
          in: query
          required: false
          description: Start date for filtering by `created_at` date.
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          description: End date for filtering by `created_at` date.
          schema:
            type: string
            format: date-time
        - name: name
          in: query
          description: Filter customers by `name` (partial match).
          schema:
            type: string
        - name: external_id
          in: query
          description: Filter by your system's `external_id`.
          schema:
            type: string
        - name: email
          in: query
          description: Filter customers by `email` address.
          schema:
            type: string
        - name: status
          in: query
          description: Filter customers by their current `status`.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CustomerStatus"
        - name: search_text
          in: query
          description: General search term to filter customers.
          schema:
            type: string
        - name: types
          in: query
          description: Filter by customer type `individual` or `business`.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CustomerType"
        - $ref: "#/components/parameters/StraddleAccountId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CustomerSummaryListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummaryListResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/CustomerSummaryListResponse"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation Failed
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server Error
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/customers/{id}:
    get:
      tags:
        - customers
      summary: Get a customer
      description: Returns a customer by `id`.
      operationId: getCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier for the customer.
        - $ref: "#/components/parameters/StraddleAccountId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation Failed
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server Error
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - customers
      summary: Update a customer
      description: Updates an existing customer's profile, status, and metadata.
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier for the customer.
        - $ref: "#/components/parameters/StraddleAccountId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
