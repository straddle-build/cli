      summary: List paykeys
      description: Returns a paginated list of paykeys for the account. Optional query
        parameters filter, search, and sort the results.
      operationId: listPaykeys
      parameters:
        - name: customer_id
          in: query
          required: false
          description: Filter paykeys by related customer ID.
          schema:
            type: string
            format: uuid
        - name: page_number
          required: false
          in: query
          description: Page number for paginated results. Starts at 1.
          schema:
            type: integer
            default: 1
            format: int32
        - name: page_size
          required: false
          in: query
          description: "Number of results per page. Maximum: 1000."
          schema:
            type: integer
            format: int32
            default: 100
        - name: status
          in: query
          required: false
          description: Filter paykeys by their current status.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PaykeyStatus"
        - name: sort_by
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaykeySortBy"
          description: Field used to sort the results.
        - name: sort_order
          required: false
          in: query
          schema:
            $ref: "#/components/schemas/SortOrder"
          description: Order in which to sort the results.
        - $ref: "#/components/parameters/StraddleAccountId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: source
          in: query
          description: Filter paykeys by their source.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PaykeySource"
        - name: unblock_eligible
          in: query
          description: Filters paykeys by unblock eligibility. `true` returns blocked
            paykeys that are eligible because of an `R29` return and have not
            been unblocked before. `false` returns blocked paykeys that are not
            eligible.
          schema:
            type: boolean
        - name: search_text
          in: query
          description: General search term to filter paykeys.
          schema:
            type: string
        - name: created_from
          in: query
          description: Start date for filtering by creation date.
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          description: End date for filtering by creation date.
          schema:
            type: string
            format: date-time
