webhooks:
  account.created.v1:
    post:
      operationId: account.created.v1
      description: Straddle sends this event when a platform creates an account. The
        `data` field contains the account.
      summary: "Webhook event: account.created.v1"
      x-svix-group-name: Accounts
      requestBody:
        description: Payload for the `account.created.v1` event.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  description: Type of this event.
                  examples:
                    - account.created.v1
                event_id:
                  type: string
                  format: uuid
                  description: Unique identifier for this event.
                  examples:
                    - 85df84c7-a298-44bc-8040-7bd2ae372cbf
                account_id:
                  type: string
                  format: uuid
                  description: Unique identifier for the account associated with this event.
                  examples:
                    - 857c679a-8e80-47f1-9334-39dd08ea801f
                data:
                  $ref: "#/components/schemas/Account"
              required:
                - event_type
                - event_id
                - account_id
                - data
      responses:
        "200":
          description: Webhook received.
